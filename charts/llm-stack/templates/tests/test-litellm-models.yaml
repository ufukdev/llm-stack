{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "llm-stack.fullname" . }}-test-litellm-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: litellm-check
      image: {{ .Values.images.curl.repository }}:{{ .Values.images.curl.tag }}
      env:
        - name: LITELLM_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "llm-stack.secretName" . }}
              key: litellmMasterKey
      command:
        - sh
        - -c
        - |
          set -e
          GATEWAY="http://{{ include "llm-stack.fullname" . }}-litellm.{{ .Release.Namespace }}.svc.cluster.local:4000"
          echo "Checking LiteLLM gateway at: $GATEWAY"
          for i in $(seq 1 20); do
            BODY=$(curl -sf \
              -H "Authorization: Bearer $LITELLM_KEY" \
              "$GATEWAY/v1/models" 2>/dev/null || true)
            if echo "$BODY" | grep -q '"id"'; then
              echo "LiteLLM /v1/models OK — at least one model present"
              exit 0
            fi
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $LITELLM_KEY" \
              "$GATEWAY/v1/models" 2>/dev/null || echo "000")
            echo "Attempt $i/20 — status: $STATUS, no models yet, retrying in 5s..."
            sleep 5
          done
          echo "LiteLLM gateway returned no models in time"
          exit 1
{{- end }}
