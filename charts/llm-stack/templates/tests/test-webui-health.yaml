{{- if .Values.openWebui.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "llm-stack.fullname" . }}-test-webui-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health-check
      image: {{ .Values.images.curl.repository }}:{{ .Values.images.curl.tag }}
      command:
        - sh
        - -c
        - |
          set -e
          BASE="http://{{ include "llm-stack.fullname" . }}-open-webui.{{ .Release.Namespace }}.svc.cluster.local"
          echo "Waiting for Open WebUI to be ready..."
          for i in $(seq 1 30); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$BASE/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Open WebUI healthy (HTTP 200)"
              break
            fi
            echo "Attempt $i/30 — status: $STATUS, retrying in 5s..."
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "Open WebUI did not become healthy in time"
            exit 1
          fi
          echo "Checking /api/models for at least one model..."
          MODELS=$(curl -sf "$BASE/api/models" 2>/dev/null || true)
          if echo "$MODELS" | grep -q '"id"'; then
            echo "Open WebUI /api/models OK — at least one model present"
            exit 0
          fi
          echo "FAIL: Open WebUI /api/models returned no models: $MODELS"
          exit 1
{{- end }}
