{{- $litellmKey := include "llm-stack.persistedSecret" (dict "root" . "key" "litellmMasterKey" "length" 32) }}
{{- if .Values.secrets.litellmMasterKey }}
  {{- $litellmKey = .Values.secrets.litellmMasterKey }}
{{- end }}

{{- $oidcSecret := include "llm-stack.persistedSecret" (dict "root" . "key" "oidcClientSecret" "length" 32) }}
{{- if .Values.secrets.oidcClientSecret }}
  {{- $oidcSecret = .Values.secrets.oidcClientSecret }}
{{- end }}

{{- $keycloakPw := include "llm-stack.persistedSecret" (dict "root" . "key" "keycloakAdminPassword" "length" 24) }}
{{- if .Values.secrets.keycloakAdminPassword }}
  {{- $keycloakPw = .Values.secrets.keycloakAdminPassword }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-stack.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
type: Opaque
data:
  litellmMasterKey: {{ $litellmKey | b64enc | quote }}
  oidcClientSecret: {{ $oidcSecret | b64enc | quote }}
  keycloakAdminPassword: {{ $keycloakPw | b64enc | quote }}
