{{/*
  webui-env.yaml — ConfigMap for Open WebUI environment variables that require
  dynamic values (Keycloak/OIDC URLs, Qdrant URL) derived from chart values.

  To inject these env vars into Open WebUI, add this to your values:
    open-webui:
      extraEnvFrom:
        - configMapRef:
            name: <fullname>-webui-env   # e.g. llm-stack-webui-env

  For CI (release=llm), the ConfigMap is named llm-llm-stack-webui-env.
  Static env vars (VECTOR_DB, ENABLE_OLLAMA_API) are set directly in
  open-webui.extraEnvVars in the values files to avoid this dependency.
*/}}
{{- if .Values.openWebui.enabled }}
{{- $oidcEnabled := or .Values.keycloak.enabled .Values.oidc.external.enabled }}
{{- if or $oidcEnabled .Values.qdrant.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-stack.fullname" . }}-webui-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
data:
  {{- if $oidcEnabled }}
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_PROVIDER_NAME: "Keycloak"
  OPENID_PROVIDER_URL: {{ include "llm-stack.oidcIssuerUrl" . | quote }}
  {{- if .Values.oidc.external.enabled }}
  OAUTH_CLIENT_ID: {{ .Values.oidc.external.clientId | quote }}
  {{- else }}
  OAUTH_CLIENT_ID: "open-webui"
  {{- end }}
  {{- end }}
  {{- if .Values.qdrant.enabled }}
  VECTOR_DB: "qdrant"
  QDRANT_URI: {{ printf "http://%s-qdrant.%s.svc.cluster.local:6333" .Release.Name .Release.Namespace | quote }}
  {{- end }}
{{- end }}
{{- end }}
