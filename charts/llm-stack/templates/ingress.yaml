{{- if .Values.ingress.enabled }}
{{- $fullname := include "llm-stack.fullname" . }}
{{- $domain := .Values.global.domain }}
{{- $tls := .Values.ingress.tls }}
{{- $hasTls := or $tls.webuiSecretName $tls.keycloakSecretName $tls.issuer }}
---
# Open WebUI Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-webui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
  {{- if and $tls.issuer (not $tls.webuiSecretName) }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $tls.issuer | quote }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if or $tls.webuiSecretName $tls.issuer }}
  tls:
    - hosts:
        - {{ .Values.openWebui.host | default (printf "chat.%s" $domain) | quote }}
      {{- if $tls.webuiSecretName }}
      secretName: {{ $tls.webuiSecretName | quote }}
      {{- else }}
      secretName: {{ printf "%s-webui-tls" $fullname | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.openWebui.host | default (printf "chat.%s" $domain) | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-open-webui
                port:
                  number: 80
{{- if .Values.keycloak.enabled }}
---
# Keycloak Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-stack.labels" . | nindent 4 }}
  {{- if and $tls.issuer (not $tls.keycloakSecretName) }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $tls.issuer | quote }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if or $tls.keycloakSecretName $tls.issuer }}
  tls:
    - hosts:
        - {{ printf "auth.%s" $domain | quote }}
      {{- if $tls.keycloakSecretName }}
      secretName: {{ $tls.keycloakSecretName | quote }}
      {{- else }}
      secretName: {{ printf "%s-keycloak-tls" $fullname | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ printf "auth.%s" $domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-keycloakx-http
                port:
                  number: 80
{{- end }}
{{- end }}
