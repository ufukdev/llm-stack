# llm-stack umbrella chart values
# Sub-chart values are nested under the chart's name as declared in Chart.yaml.
# See charts/llm-stack/ci/kind-values.yaml for a minimal working example.

# Pin the fullname so all chart-owned resources (secrets, jobs, configmaps)
# get stable names regardless of the Helm release name used at install time.
# This is what makes litellm-helm.masterkeySecretName and secret cross-references
# correct for any `helm install <anything> charts/llm-stack` invocation.
# Override only if you deploy multiple instances in the same namespace.
fullnameOverride: "llm-stack"

# ---------------------------------------------------------------------------
# Shared utility images — override for air-gapped deployments
# ---------------------------------------------------------------------------
images:
  curl:
    repository: curlimages/curl
    tag: "8.8.0"

global:
  domain: "" # e.g. example.com — used for Ingress host construction
  storageClass: "" # leave empty to use cluster default

# ---------------------------------------------------------------------------
# Inference mode: "local" (Ollama) or "external" (bring your own endpoint)
# ---------------------------------------------------------------------------
inference:
  mode: local # local | external
  external:
    baseUrl: "" # required when mode=external
    apiKey: "" # optional
    modelName: "external" # model_name used in litellm model_list; override if the endpoint expects a specific name

# ---------------------------------------------------------------------------
# Open WebUI — condition key: openWebui.enabled
# Sub-chart values go under "open-webui:" (matches Chart.yaml name)
# ---------------------------------------------------------------------------
openWebui:
  enabled: true
  host: "" # overrides global.domain-based host when set

open-webui:
  fullnameOverride: llm-stack-open-webui
  persistence:
    enabled: true
    size: 2Gi
  ollama:
    enabled: false # managed separately by the ollama sub-chart
  ollamaUrls: []
  pipelines:
    enabled: false
  # Route all model traffic through LiteLLM (OpenAI-compatible gateway).
  # The URL uses tpl so .Release.Namespace expands correctly at install time.
  enableOpenaiApi: true
  openaiBaseApiUrl: "http://llm-stack-litellm.{{ .Release.Namespace }}.svc.cluster.local:4000/v1"
  openaiApiKeyExistingSecret: "llm-stack-secrets"
  openaiApiKeyExistingSecretKey: "litellmMasterKey"
  # Dynamic env vars (OIDC URLs, Qdrant URI) come from our ConfigMap.
  # optional=true so the envFrom is a no-op when keycloak.enabled=false.
  extraEnvFrom:
    - configMapRef:
        name: llm-stack-webui-env
        optional: true
  # SSO defaults — wired to the chart-generated Keycloak realm.
  # existingConfig tells the open-webui chart to read OPENID_PROVIDER_URL
  # from the ConfigMap instead of setting an explicit (empty) env value,
  # which would otherwise win over envFrom (explicit env beats envFrom in K8s).
  sso:
    enabled: true
    enableSignup: true
    oidc:
      enabled: true
      clientId: "open-webui"
      clientExistingSecret: "llm-stack-secrets"
      clientExistingSecretKey: "oidcClientSecret"
      existingConfig: "llm-stack-webui-env"
      existingConfigProviderUrlKey: "OPENID_PROVIDER_URL"
      providerUrl: ""
      providerName: "Keycloak"
      scopes: "openid email profile"
  extraEnvVars:
    - name: ENABLE_OLLAMA_API
      value: "false"
    # Privacy: disable all external call-home behaviour by default.
    # These are the correct knobs as of Open WebUI v0.11.x.
    # Without these, Open WebUI contacts HuggingFace on startup (embedding
    # model download) and CloudFront (community registry) — both blocked
    # when networkPolicy.enabled=true and contradicting the "no data leaves"
    # guarantee. Use Ollama for embeddings so no external dependency exists.
    - name: ENABLE_COMMUNITY_SHARING
      value: "false"
    - name: SCARF_NO_ANALYTICS
      value: "true"
    - name: ANONYMIZED_TELEMETRY
      value: "false"
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: RAG_EMBEDDING_ENGINE
      value: "ollama"
    - name: RAG_EMBEDDING_MODEL
      value: "nomic-embed-text"

# ---------------------------------------------------------------------------
# Ollama (local inference)
# condition key: ollama.enabled — merged with sub-chart values
# ---------------------------------------------------------------------------
ollama:
  enabled: true
  fullnameOverride: llm-stack-ollama
  ollama:
    models:
      pull:
        - qwen2.5:0.5b
  persistence:
    enabled: true
    size: 10Gi

# ---------------------------------------------------------------------------
# Qdrant (vector store)
# condition key: qdrant.enabled — merged with sub-chart values
# ---------------------------------------------------------------------------
qdrant:
  enabled: true
  fullnameOverride: llm-stack-qdrant
  persistence:
    size: 5Gi

# ---------------------------------------------------------------------------
# Keycloak
# condition key: keycloak.enabled (our flag)
# Sub-chart values under "keycloakx:" (matches Chart.yaml name)
# ---------------------------------------------------------------------------
keycloak:
  enabled: true
  realmImport:
    enabled: true
    sslRequired: "external" # "external" (prod) | "none" (CI/dev, no TLS)
    images:
      configCli:
        repository: quay.io/adorsys/keycloak-config-cli
        # Match keycloakx appVersion major: keycloakx 7.3.0 = Keycloak 26.7.2
        tag: "latest-26.0.6"
  adminUser: admin
  adminPassword: "" # leave empty to use generated secret (keycloakAdminPassword)

keycloakx:
  fullnameOverride: llm-stack-keycloakx
  # extraEnv is a string (multiline), not a list — matches keycloakx chart schema
  extraEnv: ""
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--import-realm"

# ---------------------------------------------------------------------------
# LiteLLM gateway
# condition key: litellm.enabled (our flag)
# Sub-chart values under "litellm-helm:" (matches Chart.yaml name)
# ---------------------------------------------------------------------------
litellm:
  enabled: true

litellm-helm:
  fullnameOverride: llm-stack-litellm
  # Secret name matches llm-stack.secretName, stable via fullnameOverride above.
  masterkeySecretName: llm-stack-secrets
  masterkeySecretKey: litellmMasterKey
  db:
    deployStandalone: true
  # Use our chart-generated ConfigMap instead of litellm-helm's proxy_config rendering.
  # The ConfigMap is produced by templates/litellm-config.yaml from inference.* values.
  configmap:
    create: false
    name: llm-stack-litellm-config
    key: config.yaml

# ---------------------------------------------------------------------------
# OIDC — populated by keycloak-realm-job when keycloak.enabled=true
# Set oidc.external.enabled=true to skip Keycloak and use your own IdP
# ---------------------------------------------------------------------------
oidc:
  external:
    enabled: false
    issuerUrl: ""
    clientSecret: ""

# ---------------------------------------------------------------------------
# NetworkPolicy (requires a CNI that enforces policies, e.g. Calico)
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # Opt-in egress CIDR whitelist — only active when enabled=true.
  # Add specific IP ranges (e.g. an internal proxy or private registry) when
  # pods must reach known external endpoints over HTTPS.
  # Example: ["10.0.0.0/8", "192.168.1.100/32"]
  allowedEgressCIDRs: []

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  tls:
    webuiSecretName: ""    # TLS secret for chat.<domain>; leave empty for cert-manager
    keycloakSecretName: "" # TLS secret for auth.<domain>; leave empty for cert-manager
    issuer: "" # cert-manager ClusterIssuer name

# ---------------------------------------------------------------------------
# Shared secrets — generated on first install, stable across upgrades
# Set non-empty values here for GitOps / external secret managers
# ---------------------------------------------------------------------------
secrets:
  litellmMasterKey: ""
  oidcClientSecret: ""
  keycloakAdminPassword: ""
