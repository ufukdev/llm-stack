# CI scenario: external OIDC provider (no Keycloak)
# Verifies that keycloakx subchart and realm import job are NOT rendered.

global:
  domain: "local.test"

inference:
  mode: local

openWebui:
  enabled: true

open-webui:
  persistence:
    enabled: true
    size: 1Gi

ollama:
  enabled: true
  ollama:
    models:
      pull:
        - qwen2.5:0.5b
        - nomic-embed-text
  persistence:
    enabled: true
    size: 5Gi

qdrant:
  enabled: true
  persistence:
    size: 1Gi

# Keycloak disabled — using external IdP
keycloak:
  enabled: false
  realmImport:
    enabled: false

# External OIDC configuration
oidc:
  external:
    enabled: true
    issuerUrl: "https://sso.example.com/realms/my-realm"
    clientSecret: "external-secret-placeholder"

litellm:
  enabled: true

networkPolicy:
  enabled: false

ingress:
  enabled: false
