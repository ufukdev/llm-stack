# CI scenario: external inference endpoint (no Ollama)
# Verifies that the ollama subchart is NOT rendered.

global:
  domain: "local.test"

inference:
  mode: external
  external:
    baseUrl: "https://api.example.com/v1"
    apiKey: "sk-placeholder"

openWebui:
  enabled: true

open-webui:
  persistence:
    enabled: true
    size: 1Gi
  ollama:
    enabled: false
  ollamaUrls: [] # no local Ollama
  pipelines:
    enabled: false
  openaiBaseApiUrl: "https://api.example.com/v1"
  openaiApiKeyExistingSecret: ""
  openaiApiKey: "sk-placeholder"
  # No Keycloak in this scenario — disable SSO to avoid a configMapKeyRef
  # for OPENID_PROVIDER_URL that open-webui renders when sso.oidc.enabled=true.
  # Without this, the Pod fails to start because the key is absent from the
  # webui-env ConfigMap (only written when keycloak.enabled or oidc.external.enabled).
  sso:
    enabled: false
    oidc:
      enabled: false

# Ollama disabled — using external inference
ollama:
  enabled: false

qdrant:
  enabled: true
  persistence:
    size: 1Gi

keycloak:
  enabled: false
  realmImport:
    enabled: false

litellm:
  enabled: false

networkPolicy:
  enabled: false

ingress:
  enabled: false
