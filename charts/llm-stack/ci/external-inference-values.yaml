# CI scenario: external inference endpoint (no Ollama)
# Verifies that the ollama subchart is NOT rendered.

global:
  domain: "local.test"

inference:
  mode: external
  external:
    baseUrl: "https://api.example.com/v1"
    apiKey: "sk-placeholder"

openWebui:
  enabled: true

open-webui:
  persistence:
    enabled: true
    size: 1Gi
  ollama:
    enabled: false
  ollamaUrls: []   # no local Ollama
  pipelines:
    enabled: false
  extraEnvVars:
    - name: ENABLE_COMMUNITY_SHARING
      value: "false"
    - name: SCARF_NO_ANALYTICS
      value: "true"
    - name: ANONYMIZED_TELEMETRY
      value: "false"
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: VECTOR_DB
      value: "qdrant"
    - name: QDRANT_URI
      value: "http://llm-qdrant.llm.svc.cluster.local:6333"
  openaiBaseApiUrl: "https://api.example.com/v1"
  openaiApiKey: "sk-placeholder"

# Ollama disabled — using external inference
ollama:
  enabled: false

qdrant:
  enabled: true
  persistence:
    size: 1Gi

keycloak:
  enabled: false
  realmImport:
    enabled: false

litellm:
  enabled: false

networkPolicy:
  enabled: false

ingress:
  enabled: false
