# Minimal values for kind/CI testing
# Uses small model, no Ingress, no TLS, no NetworkPolicy

global:
  domain: "local.test"

inference:
  mode: local

openWebui:
  enabled: true

open-webui:
  persistence:
    enabled: true
    size: 1Gi
  ollama:
    enabled: false
  ollamaUrls:
    - http://llm-ollama.llm.svc.cluster.local:11434
  pipelines:
    enabled: false
  extraEnvVars:
    - name: ENABLE_OLLAMA_API
      value: "true"
  # SSO: point to internal Keycloak (browser redirect only works with Ingress in prod)
  sso:
    enabled: true
    enableSignup: true
    oidc:
      enabled: true
      clientId: "open-webui"
      # Reference the chart-generated secret (CI release name is "llm" → "llm-llm-stack-secrets")
      clientExistingSecret: "llm-llm-stack-secrets"
      clientExistingSecretKey: "oidcClientSecret"
      providerUrl: "http://llm-keycloakx-http.llm.svc.cluster.local:80/auth/realms/llm-stack"
      providerName: "Keycloak"
      scopes: "openid email profile"

ollama:
  enabled: true
  ollama:
    models:
      pull:
        - qwen2.5:0.5b
  persistence:
    enabled: true
    size: 5Gi

qdrant:
  enabled: true
  persistence:
    size: 1Gi

keycloak:
  enabled: true
  realmImport:
    enabled: true
  adminPassword: "admin"   # matches KEYCLOAK_ADMIN_PASSWORD below

# keycloakx sub-chart overrides for kind (no TLS, no strict hostname)
keycloakx:
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--import-realm"
    - "--hostname-strict=false"
    - "--http-enabled=true"
  # extraEnv is a string in keycloakx chart (not a list)
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: admin
    - name: KC_PROXY
      value: "edge"

litellm:
  enabled: false

networkPolicy:
  enabled: false

ingress:
  enabled: false
