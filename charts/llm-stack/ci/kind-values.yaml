# Minimal values for kind/CI testing
# Uses small model, no Ingress, no TLS, no NetworkPolicy

global:
  domain: "local.test"

inference:
  mode: local

openWebui:
  enabled: true

open-webui:
  persistence:
    enabled: true
    size: 1Gi
  ollama:
    enabled: false
  ollamaUrls:
    - http://llm-ollama.llm.svc.cluster.local:11434
  pipelines:
    enabled: false
  extraEnvVars:
    - name: ENABLE_OLLAMA_API
      value: "true"
    - name: ENABLE_COMMUNITY_SHARING
      value: "false"
    - name: SCARF_NO_ANALYTICS
      value: "true"
    - name: ANONYMIZED_TELEMETRY
      value: "false"
    - name: HF_HUB_OFFLINE
      value: "1"
    - name: RAG_EMBEDDING_ENGINE
      value: "ollama"
    - name: RAG_EMBEDDING_MODEL
      value: "nomic-embed-text"
    - name: VECTOR_DB
      value: "qdrant"
    - name: QDRANT_URI
      value: "http://llm-qdrant.llm.svc.cluster.local:6333"
  # LiteLLM gateway as OpenAI-compatible backend
  # CI release = "llm", so service is llm-litellm.llm.svc.cluster.local
  openaiBaseApiUrl: "http://llm-litellm.llm.svc.cluster.local:4000/v1"
  openaiApiKeyExistingSecret: "llm-stack-secrets"
  openaiApiKeyExistingSecretKey: "litellmMasterKey"
  # SSO: point to internal Keycloak (browser redirect only works with Ingress in prod)
  sso:
    enabled: true
    enableSignup: true
    oidc:
      enabled: true
      clientId: "open-webui"
      # Reference the chart-generated secret (CI release name is "llm" → "llm-stack-secrets")
      clientExistingSecret: "llm-stack-secrets"
      clientExistingSecretKey: "oidcClientSecret"
      providerUrl: "http://llm-keycloakx-http.llm.svc.cluster.local:80/auth/realms/llm-stack"
      providerName: "Keycloak"
      scopes: "openid email profile"

ollama:
  enabled: true
  ollama:
    models:
      pull:
        - qwen2.5:0.5b
  persistence:
    enabled: true
    size: 5Gi

qdrant:
  enabled: true
  persistence:
    size: 1Gi

keycloak:
  enabled: true
  realmImport:
    enabled: true
    sslRequired: "none"    # no TLS in kind; production default is "external"
  adminPassword: "admin"   # matches KEYCLOAK_ADMIN_PASSWORD below

# keycloakx sub-chart overrides for kind (no TLS, no strict hostname)
keycloakx:
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--import-realm"
    - "--hostname-strict=false"
    - "--http-enabled=true"
  # extraEnv is a string in keycloakx chart (not a list)
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: admin
    - name: KC_PROXY
      value: "edge"

litellm:
  enabled: true

# litellm-helm sub-chart: CI release is "llm" → secret name is "llm-stack-secrets"
litellm-helm:
  masterkeySecretName: "llm-stack-secrets"
  masterkeySecretKey: "litellmMasterKey"
  db:
    deployStandalone: true
  proxy_config:
    model_list:
      - model_name: qwen2.5-0.5b
        litellm_params:
          model: ollama/qwen2.5:0.5b
          api_base: "http://llm-ollama.llm.svc.cluster.local:11434"
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY

networkPolicy:
  enabled: false

ingress:
  enabled: false
