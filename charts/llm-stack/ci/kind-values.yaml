# Minimal values for kind/CI testing
# Uses small model, no Ingress, no TLS, no NetworkPolicy

global:
  domain: "local.test"

inference:
  mode: local

openWebui:
  enabled: true

open-webui:
  persistence:
    enabled: true
    size: 1Gi

ollama:
  enabled: true
  ollama:
    models:
      pull:
        - qwen2.5:0.5b
  persistence:
    enabled: true
    size: 5Gi

qdrant:
  enabled: true
  persistence:
    size: 1Gi

keycloak:
  enabled: true
  realmImport:
    enabled: true
    sslRequired: "none"    # no TLS in kind; production default is "external"
  adminPassword: "admin"   # matches KEYCLOAK_ADMIN_PASSWORD below

# keycloakx sub-chart overrides for kind (no TLS, no strict hostname)
keycloakx:
  command:
    - "/opt/keycloak/bin/kc.sh"
    - "start"
    - "--import-realm"
    - "--hostname-strict=false"
    - "--http-enabled=true"
  # extraEnv is a string in keycloakx chart (not a list)
  extraEnv: |
    - name: KEYCLOAK_ADMIN
      value: admin
    - name: KEYCLOAK_ADMIN_PASSWORD
      value: admin
    - name: KC_PROXY
      value: "edge"

litellm:
  enabled: true

# litellm model list is auto-generated from ollama.ollama.models.pull by
# templates/litellm-config.yaml — no override needed here.

networkPolicy:
  enabled: false

ingress:
  enabled: false
